<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMULA 1 PITLANE PHOTOBOOTH • 10 RACING STRIP STYLES</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        f1: {
                            red: '#e10600',
                            crimson: '#991b1b',
                            carbon: '#0b0d12',
                            panel: '#151922',
                            silver: '#e2e8f0',
                            papaya: '#ff8700',
                            bull: '#1e3a8a',
                            gold: '#fbbf24'
                        }
                    },
                    fontFamily: {
                        orbitron: ['"Orbitron"', 'sans-serif'],
                        rajdhani: ['"Rajdhani"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0d12;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(225, 6, 0, 0.24) 0%, transparent 45%),
                radial-gradient(circle at 88% 85%, rgba(30, 58, 138, 0.22) 0%, transparent 45%),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 48px);
        }

        .racing-panel {
            background: rgba(21, 25, 34, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.55);
        }

        .f1-style-btn {
            background: rgba(11, 13, 18, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.14);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .f1-style-btn:hover {
            border-color: #e10600;
            transform: translateY(-2px);
        }
        .f1-style-btn.active {
            background: linear-gradient(135deg, rgba(225, 6, 0, 0.35), rgba(15, 23, 42, 0.95));
            border-color: #e10600;
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.4);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            transition: all 0.2s ease;
        }
        .glass-btn:hover {
            background: rgba(225, 6, 0, 0.25);
            border-color: #e10600;
        }
        .glass-btn.active {
            background: #e10600;
            color: #ffffff;
            border-color: #ffffff;
            font-weight: 700;
        }

        @keyframes cameraFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        .flash-active {
            animation: cameraFlash 0.45s ease-out forwards;
        }
    </style>
</head>

                    <i class="fa-solid fa-flag-checkered text-lg"></i>
                </div>

                    <div class="flex items-center gap-2">
                        <h1 class="font-orbitron font-black text-lg sm:text-2xl text-white tracking-wider leading-none">PITLANE BOOTH</h1>

    <!-- MAIN STUDIO -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const videoEl = document.getElementById('webcam-video');
            const studioCanvas = document.getElementById('studio-canvas');
            const studioCtx = studioCanvas.getContext('2d');
            const exportCanvas = document.getElementById('strip-export-canvas');
            const exportCtx = exportCanvas.getContext('2d');
            const previewImg = document.getElementById('strip-preview-img');

            const cameraSelect = document.getElementById('camera-select');
            const cameraErrorBanner = document.getElementById('camera-error-banner');
            const cameraErrorMsg = document.getElementById('camera-error-msg');
            const btnRetryCamera = document.getElementById('btn-retry-camera');
            const btnUseDemo = document.getElementById('btn-use-demo');
            const btnToggleDemo = document.getElementById('btn-toggle-demo');
            const btnMirrorToggle = document.getElementById('btn-mirror-toggle');
            const btnToggleSound = document.getElementById('btn-toggle-sound');
            const soundIcon = document.getElementById('sound-icon');
            const soundLabel = document.getElementById('sound-label');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownText = document.getElementById('countdown-text');
            const countdownFrameNum = document.getElementById('countdown-frame-num');
            const cameraFlash = document.getElementById('camera-flash');

            const activeFrameBadge = document.getElementById('active-frame-badge');
            const btnActiveFrameNum = document.getElementById('btn-active-frame-num');
            const framesPickerGrid = document.getElementById('frames-picker-grid');
            const frameFileInput = document.getElementById('frame-file-input');
            const inputDriverTag = document.getElementById('input-driver-tag');
            const styleBadge = document.getElementById('style-badge');

            const btnStartFullSession = document.getElementById('btn-start-full-session');
            const btnSnapSingleFrame = document.getElementById('btn-snap-single-frame');
            const btnDownloadPng = document.getElementById('btn-download-png');
            const btnCopyImage = document.getElementById('btn-copy-image');
            const btnResetAll = document.getElementById('btn-reset-all');

            // App State
            let currentStyle = 1; // 1 to 10
            let currentFilter = 'normal';
            let isMuted = false;
            let isMirrored = true;
            let useDemoMode = false;
            let isCapturing = false;
            let activeFrame = 1; // 1 to 3
            let currentStream = null;
            let studioAnimId = null;

            const styleNames = {
                1: '#01 RED ROCKET',
                2: '#02 SCUDERIA',
                3: '#03 SILVER STAR',
                4: '#04 BULL CHARGE',
                5: '#05 PAPAYA GP',
                6: '#06 CHECKERED',
                7: '#07 TELEMETRY',
                8: '#08 NIGHT GP',
                9: '#09 VINTAGE GP',
                10: '#10 PODIUM P1'
            };

            const framesData = [null, null, null];

            // Web Audio API Sound Effects
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            function playBeep(freq = 640, dur = 0.14) {
                if (isMuted) return;
                try {
                    initAudio();
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (e) {}
            }
            function playEngineShutter() {
                if (isMuted) return;
                try {
                    initAudio();
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(65, now + 0.18);
                    gain.gain.setValueAtTime(0.32, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } catch (e) {}
            }

            function showToast(msg) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'px-4 py-2.5 rounded-xl bg-slate-950/95 border border-f1-red text-white font-mono text-xs shadow-xl transition-opacity duration-300';
                toast.textContent = `🏎️ ${msg}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 2600);
            }

            // Camera Setup
            function stopCurrentStream() {
                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                    currentStream = null;
                }
                if (videoEl.srcObject) videoEl.srcObject = null;
            }

            async function populateCameraDevices() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(d => d.kind === 'videoinput');
                    cameraSelect.innerHTML = '';
                    if (videoDevices.length > 0) {
                        videoDevices.forEach((dev, idx) => {
                            const opt = document.createElement('option');
                            opt.value = dev.deviceId;
                            opt.textContent = dev.label || `Camera ${idx + 1}`;
                            cameraSelect.appendChild(opt);
                        });
                        cameraSelect.classList.remove('hidden');
                    }
                } catch (e) {}
            }

            async function initCamera(deviceId = null) {
                stopCurrentStream();
                cameraErrorBanner.classList.add('hidden');
                useDemoMode = false;
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping';
                statusText.textContent = 'STARTING CAMERA...';

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    activateDemoFallback('WebRTC not supported in this browser.');
                    return;
                }

                let stream = null;
                try {
                    const constraints = {
                        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                        audio: false
                    };
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e1) {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } catch (e2) {
                        activateDemoFallback('Camera blocked or unavailable. Demo mode enabled.');
                        return;
                    }
                }

                try {
                    currentStream = stream;
                    videoEl.srcObject = stream;
                    videoEl.setAttribute('playsinline', '');
                    videoEl.setAttribute('webkit-playsinline', '');
                    videoEl.muted = true;
                    await videoEl.play().catch(() => {});

                    statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                    statusText.textContent = 'LIVE CAMERA READY';
                    document.getElementById('demo-toggle-text').textContent = 'SWITCH TO DEMO FEED';
                    await populateCameraDevices();
                    if (deviceId) cameraSelect.value = deviceId;
                    startStudioLoop();
                } catch (e) {
                    activateDemoFallback('Stream error. Demo mode enabled.');
                }
            }

            function activateDemoFallback(msg) {
                useDemoMode = true;
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-f1-red animate-bounce';
                statusText.textContent = 'DEMO PIT FEED ACTIVE';
                cameraErrorMsg.textContent = `⚠️ ${msg}`;
                cameraErrorBanner.classList.remove('hidden');
                document.getElementById('demo-toggle-text').textContent = 'SWITCH TO WEBCAM';
                startStudioLoop();
            }

            // Live Viewfinder Loop
            function startStudioLoop() {
                if (studioAnimId) cancelAnimationFrame(studioAnimId);
                studioCanvas.width = 640;
                studioCanvas.height = 480;

                let t = 0;
                function loop() {
                    t += 0.04;
                    const ready = !useDemoMode && videoEl.readyState >= 2 && videoEl.videoWidth > 0;

                    if (useDemoMode || !ready) {
                        const grad = studioCtx.createLinearGradient(0, 0, 640, 480);
                        grad.addColorStop(0, '#111827');
                        grad.addColorStop(0.5, '#7f1d1d');
                        grad.addColorStop(1, '#090d16');
                        studioCtx.fillStyle = grad;
                        studioCtx.fillRect(0, 0, 640, 480);

                        // Race track curbs
                        studioCtx.fillStyle = '#e10600';
                        studioCtx.fillRect(0, 410, 640, 22);
                        studioCtx.fillStyle = '#ffffff';
                        for (let x = 0; x < 640; x += 64) {
                            studioCtx.fillRect(x, 410, 32, 22);
                        }

                        // Demo F1 Car & Driver
                        const carX = 320 + Math.sin(t * 1.5) * 35;
                        drawF1CarVector(studioCtx, carX, 275, 2.2, '#e10600', '#ffffff');

                        studioCtx.fillStyle = '#ffffff';
                        studioCtx.font = '800 22px "Orbitron", sans-serif';
                        studioCtx.textAlign = 'center';
                        studioCtx.fillText('PITLANE DEMO FEED', 320, 75);
                    } else {
                        studioCtx.save();
                        if (isMirrored) {
                            studioCtx.translate(640, 0);
                            studioCtx.scale(-1, 1);
                        }
                        studioCtx.drawImage(videoEl, 0, 0, 640, 480);
                        studioCtx.restore();
                    }

                    if (currentFilter !== 'normal') {
                        applyFilter(studioCtx, 640, 480, currentFilter);
                    }

                    studioAnimId = requestAnimationFrame(loop);
                }
                loop();
            }

            function applyFilter(ctx, w, h, type) {
                const img = ctx.getImageData(0, 0, w, h);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    if (type === 'crimson') {
                        d[i] = Math.min(255, d[i] * 1.2 + 12);
                        d[i + 1] = Math.min(255, d[i + 1] * 0.88);
                        d[i + 2] = Math.min(255, d[i + 2] * 0.9);
                    } else if (type === 'silver') {
                        const g = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
                        d[i] = Math.min(255, g * 0.92 + 8);
                        d[i + 1] = Math.min(255, g * 1.02 + 10);
                        d[i + 2] = Math.min(255, g * 1.14 + 14);
                    } else if (type === 'warm') {
                        d[i] = Math.min(255, d[i] * 1.15 + 10);
                        d[i + 1] = Math.min(255, d[i + 1] * 1.04);
                        d[i + 2] = Math.min(255, d[i + 2] * 0.85);
                    } else if (type === 'mono') {
                        const g = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
                        const c = Math.max(0, Math.min(255, (g - 128) * 1.28 + 128));
                        d[i] = d[i + 1] = d[i + 2] = c;
                    }
                }
                ctx.putImageData(img, 0, 0);
            }

            frameFileInput.addEventListener('change', (e) => {
                const slot = parseInt(frameFileInput.getAttribute('data-slot') || activeFrame);
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        c.width = 640; c.height = 480;
                        const ctx = c.getContext('2d');
                        const scale = Math.max(640 / img.width, 480 / img.height);
                        const sw = img.width * scale;
                        const sh = img.height * scale;
                        ctx.drawImage(img, (640 - sw) / 2, (480 - sh) / 2, sw, sh);
                        framesData[slot - 1] = c;
                        renderFramesPickerUI();
                        renderPhotostrip();
                        showToast(`Uploaded to Slot ${slot}!`);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
                frameFileInput.value = '';
            });

            function snapViewfinder() {
                const c = document.createElement('canvas');

            function runCountdown(sec, slotNum) {
                return new Promise((resolve) => {
                    countdownFrameNum.textContent = slotNum;
                    countdownOverlay.classList.remove('opacity-0', 'pointer-events-none');
                    let count = sec;
                    countdownText.textContent = count;
                    playBeep(560, 0.14);

                    const timer = setInterval(() => {
                        count--;
                        if (count > 0) {
                            countdownText.textContent = count;
                            playBeep(560 + (3 - count) * 120, 0.14);
                        } else {
                            clearInterval(timer);
                            countdownOverlay.classList.add('opacity-0', 'pointer-events-none');
                            resolve();
                        }
                    }, 900);
                });
            }

            function triggerFlash() {
                playEngineShutter();
                cameraFlash.classList.add('flash-active');
                setTimeout(() => cameraFlash.classList.remove('flash-active'), 450);
            }

            btnSnapSingleFrame.addEventListener('click', async () => {
                if (isCapturing) return;
                isCapturing = true;
                await runCountdown(3, activeFrame);
                triggerFlash();
                framesData[activeFrame - 1] = snapViewfinder();
                renderFramesPickerUI();
                renderPhotostrip();
                if (activeFrame < 3) activeFrame++;
                renderFramesPickerUI();
                isCapturing = false;
                showToast('Lap photo captured!');
            });

                if (isCapturing) return;
                isCapturing = true;
                btnStartFullSession.disabled = true;

                for (let s = 1; s <= 3; s++) {

                    renderFramesPickerUI();

                    triggerFlash();
                    framesData[s - 1] = snapViewfinder();
                    renderFramesPickerUI();
                    renderPhotostrip();
                    if (s < 3) await new Promise(r => setTimeout(r, 750));
                }

                isCapturing = false;

            // ==================== SHARED F1 ARTWORK HELPERS ====================
            function drawPhotoSlot(ctx, index, x, y, w, h, options = {}) {
                const { borderColor = null, borderWidth = 0, radius = 0, skewX = 0 } = options;
                const photo = framesData[index];

                ctx.save();
                if (skewX !== 0) {
                    ctx.transform(1, 0, skewX, 1, -skewX * (y + h / 2), 0);
                }

                ctx.beginPath();
                if (radius > 0) ctx.roundRect(x, y, w, h, radius);
                else ctx.rect(x, y, w, h);
                ctx.clip();

                if (photo) {
                    const scale = Math.max(w / photo.width, h / photo.height);
                    const dw = photo.width * scale;
                    const dh = photo.height * scale;
                    ctx.drawImage(photo, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
                } else {
                    ctx.fillStyle = '#181d28';
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '800 22px "Orbitron", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`LAP 0${index + 1}`, x + w / 2, y + h / 2);
                }
                ctx.restore();

                if (borderColor && borderWidth > 0) {
                    ctx.save();
                    if (skewX !== 0) {
                        ctx.transform(1, 0, skewX, 1, -skewX * (y + h / 2), 0);
                    }
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = borderWidth;
                    if (radius > 0) {
                        ctx.beginPath();
                        ctx.roundRect(x, y, w, h, radius);
                        ctx.stroke();
                    } else {
                        ctx.strokeRect(x, y, w, h);
                    }
                    ctx.restore();
                }
            }

            // Formula 1 Open-Wheel Race Car Vector
            function drawF1CarVector(ctx, cx, cy, scale = 1, bodyColor = '#e10600', accentColor = '#ffffff') {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                // Rear tires
                ctx.fillStyle = '#111111';
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.roundRect(-52, -26, 28, 16, 4); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.roundRect(-52, 10, 28, 16, 4); ctx.fill(); ctx.stroke();

                // Front tires
                ctx.beginPath(); ctx.roundRect(22, -23, 24, 13, 3); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.roundRect(22, 10, 24, 13, 3); ctx.fill(); ctx.stroke();

                // Rear wing
                ctx.fillStyle = bodyColor;
                ctx.beginPath(); ctx.roundRect(-62, -24, 14, 48, 2); ctx.fill();
                ctx.fillStyle = accentColor;
                ctx.fillRect(-62, -24, 14, 5);
                ctx.fillRect(-62, 19, 14, 5);

                // Main chassis & sidepods
                ctx.fillStyle = bodyColor;
                ctx.beginPath();
                ctx.moveTo(-48, -14);
                ctx.lineTo(15, -11);
                ctx.lineTo(66, -4);
                ctx.lineTo(66, 4);
                ctx.lineTo(15, 11);
                ctx.lineTo(-48, 14);
                ctx.closePath();
                ctx.fill();

                // Sidepod accent stripe
                ctx.fillStyle = accentColor;
                ctx.beginPath();
                ctx.moveTo(-25, -13); ctx.lineTo(12, -10); ctx.lineTo(12, -7); ctx.lineTo(-25, -9);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-25, 13); ctx.lineTo(12, 10); ctx.lineTo(12, 7); ctx.lineTo(-25, 9);
                ctx.fill();

                // Halo & Cockpit
                ctx.fillStyle = '#090d16';
                ctx.beginPath(); ctx.ellipse(2, 0, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2.5;
                ctx.beginPath(); ctx.arc(5, 0, 8, -Math.PI * 0.65, Math.PI * 0.65); ctx.stroke();

                // Front wing
                ctx.fillStyle = bodyColor;
                ctx.beginPath(); ctx.roundRect(58, -28, 12, 56, 3); ctx.fill();
                ctx.fillStyle = accentColor;
                ctx.fillRect(67, -28, 3, 56);

                ctx.restore();
            }

            // Ferrari-Inspired Shield & Prancing Horse Emblem
            function drawFerrariInspiredBadge(ctx, cx, cy, scale = 1) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                // Yellow shield outer
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#111111';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-36, -42);
                ctx.lineTo(36, -42);
                ctx.lineTo(36, 6);
                ctx.quadraticCurveTo(36, 38, 0, 48);
                ctx.quadraticCurveTo(-36, 38, -36, 6);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Top Italian tricolor band
                ctx.fillStyle = '#16a34a'; ctx.fillRect(-34, -40, 22.6, 12);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(-11.4, -40, 22.8, 12);
                ctx.fillStyle = '#dc2626'; ctx.fillRect(11.4, -40, 22.6, 12);

                // Prancing horse silhouette
                ctx.fillStyle = '#111111';
                ctx.beginPath();
                ctx.moveTo(-10, 26);
                ctx.lineTo(-4, 10);
                ctx.lineTo(-14, 2);
                ctx.lineTo(-6, -12);
                ctx.lineTo(4, -20);
                ctx.lineTo(14, -14);
                ctx.lineTo(6, -8);
                ctx.lineTo(16, 4);
                ctx.lineTo(8, 10);
                ctx.lineTo(12, 26);
                ctx.lineTo(5, 26);
                ctx.lineTo(2, 14);
                ctx.lineTo(-4, 26);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // Mercedes-Inspired Three-Pointed Star in Laurel Ring
            function drawMercedesInspiredBadge(ctx, cx, cy, scale = 1) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(0, 0, 40, 0, Math.PI * 2); ctx.stroke();

                ctx.fillStyle = 'rgba(20, 184, 166, 0.22)';
                ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill();

                // 3-pointed star
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 3; i++) {
                    ctx.save();
                    ctx.rotate((i * Math.PI * 2) / 3 - Math.PI / 2);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-7, 6);
                    ctx.lineTo(0, -34);
                    ctx.lineTo(7, 6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }

            // Red Bull-Inspired Sun & Twin Bulls Emblem
            function drawRedBullInspiredBadge(ctx, cx, cy, scale = 1) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);

                // Golden Sunburst
                ctx.fillStyle = '#facc15';
                ctx.beginPath(); ctx.arc(0, -6, 32, 0, Math.PI * 2); ctx.fill();

                // Red Crimson Bar
                ctx.fillStyle = '#dc2626';
                ctx.beginPath(); ctx.roundRect(-48, -14, 96, 26, 6); ctx.fill();

                // Twin Bulls Silhouettes
                ctx.fillStyle = '#111111';
                // Left Bull
                ctx.beginPath(); ctx.ellipse(-22, -1, 13, 8, -0.15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-10, -4); ctx.lineTo(2, -10); ctx.lineTo(-6, 3); ctx.fill();
                // Right Bull
                ctx.beginPath(); ctx.ellipse(22, -1, 13, 8, 0.15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(10, -4); ctx.lineTo(-2, -10); ctx.lineTo(6, 3); ctx.fill();

                ctx.restore();
            }

            function drawCheckeredStrip(ctx, x, y, w, h, sqSize = 14) {
                ctx.save();
                ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
                const cols = Math.ceil(w / sqSize) + 1;
                const rows = Math.ceil(h / sqSize) + 1;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#0f172a';
                        ctx.fillRect(x + c * sqSize, y + r * sqSize, sqSize, sqSize);
                    }
                }
                ctx.restore();
            }


            // ==================== 10 FORMULA 1 PHOTOSTRIP STYLES ====================
            function renderPhotostrip() {
                const W = 500;
                const H = 1500;
                exportCanvas.width = W;
                exportCanvas.height = H;
                const ctx = exportCtx;
                const tag = (inputDriverTag.value || 'DRIVER #01').toUpperCase();

                ctx.clearRect(0, 0, W, H);

                switch (currentStyle) {
                    case 1: renderStyle1RedRocket(ctx, W, H, tag); break;
                    case 2: renderStyle2Scuderia(ctx, W, H, tag); break;
                    case 3: renderStyle3SilverStar(ctx, W, H, tag); break;
                    case 4: renderStyle4BullCharge(ctx, W, H, tag); break;
                    case 5: renderStyle5PapayaGP(ctx, W, H, tag); break;
                    case 6: renderStyle6Checkered(ctx, W, H, tag); break;
                    case 7: renderStyle7Telemetry(ctx, W, H, tag); break;
                    case 8: renderStyle8NightGP(ctx, W, H, tag); break;
                    case 9: renderStyle9VintageGP(ctx, W, H, tag); break;
                    case 10: renderStyle10PodiumP1(ctx, W, H, tag); break;
                }

                previewImg.src = exportCanvas.toDataURL('image/png');
            }

            // #01: RED ROCKET (Vibrant Red Strip, Racing Car & Speed Stripes)
            function renderStyle1RedRocket(ctx, W, H, tag) {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#e10600');
                grad.addColorStop(0.5, '#b91c1c');
                grad.addColorStop(1, '#7f1d1d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // White & Black Speed Stripes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(24, 0, 12, H);
                ctx.fillStyle = '#090d16';
                ctx.fillRect(42, 0, 6, H);

                // Header
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 34px "Orbitron", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('FORMULA 1', 265, 68);
                ctx.fillStyle = '#fecaca';
                ctx.font = '700 15px "Space Mono", monospace';
                ctx.fillText('RED ROCKET • GRAND PRIX', 265, 98);

                // 3 Photo Slots
                drawPhotoSlot(ctx, 0, 72, 130, 385, 330, { borderColor: '#ffffff', borderWidth: 5, radius: 10 });
                drawPhotoSlot(ctx, 1, 72, 545, 385, 330, { borderColor: '#ffffff', borderWidth: 5, radius: 10 });
                drawPhotoSlot(ctx, 2, 72, 960, 385, 330, { borderColor: '#ffffff', borderWidth: 5, radius: 10 });

                // Red F1 Race Car between slots
                drawF1CarVector(ctx, 265, 502, 1.55, '#ffffff', '#e10600');
                drawF1CarVector(ctx, 265, 918, 1.55, '#090d16', '#ffffff');

                // Bottom Footer with Car & Tag

                    ctx.strokeStyle = t.color;

            // Export & Reset Actions
            btnDownloadPng.addEventListener('click', () => {
                renderPhotostrip();
                playBeep(880, 0.2);
                const link = document.createElement('a');
                link.download = `F1_Photostrip_Style${currentStyle}_${Date.now()}.png`;
                link.href = exportCanvas.toDataURL('image/png');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('F1 Photostrip PNG downloaded!');
            });

            btnCopyImage.addEventListener('click', () => {
                renderPhotostrip();
                try {
                    exportCanvas.toBlob(async (blob) => {
                        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                        showToast('Copied strip to clipboard!');
                    });
                } catch (e) {
                    showToast('Use Download button to save PNG!');
                }
            });

            btnResetAll.addEventListener('click', () => {
                for (let i = 0; i < 3; i++) framesData[i] = null;
                activeFrame = 1;
                renderFramesPickerUI();
                renderPhotostrip();
                showToast('All 3 slots reset!');
            });

            // Initialize App
            renderFramesPickerUI();
            renderPhotostrip();
            initCamera();
        });
    </script>
